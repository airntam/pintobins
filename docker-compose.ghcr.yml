# Same stack as docker-compose.yml, but pulls the prebuilt images from GHCR
# (built by .github/workflows/images.yml) instead of building on the server.
# PUBLIC_BASE_URL defaults to http://localhost:<WEB_PORT>; set it only for a LAN address or domain.
# Set GHCR_OWNER to your GitHub user or org (lowercase). If the packages are private,
# `docker login ghcr.io` on the server first (or add the registry in Portainer).
name: bins

services:
  pocketbase:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/bins-pocketbase:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    volumes:
      - pb_data:/pb_data
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/bins-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PB_URL: http://pocketbase:8090
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-3000}}
      ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-3000}}
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:

volumes:
  pb_data:
